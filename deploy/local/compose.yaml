name: testmoon
x-app: &app
  image: testmoon/app:0.1.0
  build:
    context: ../..
    dockerfile: deploy/local/app.Dockerfile
  restart: unless-stopped
  stop_grace_period: 30s
x-app-env: &app-env
  TESTMOON_SERVICE_KEY: ${TESTMOON_SERVICE_KEY:?required}
  TESTMOON_ENCRYPTION_KEY: ${TESTMOON_ENCRYPTION_KEY:?required}
  TESTMOON_REDIS: redis:6379
  TESTMOON_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  TESTMOON_KAFKA: kafka:9092
  TESTMOON_IDENTITY: identity:9091
  TESTMOON_CORE: core:9092
  TESTMOON_EXECUTION: execution:9093
  TESTMOON_MOCK: mock:9094
  TESTMOON_WEB_ORIGIN: http://localhost:${GATEWAY_PORT:-18080}
  TESTMOON_MOCK_HOST: mock.localhost
  TESTMOON_SECURE_COOKIE: "false"
x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s
services:
  mysql:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/infra.sh up}
      MYSQL_USER: testmoon
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_HOST: "%"
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?required}']
    environment: {REDIS_PASSWORD: '${REDIS_PASSWORD}'}
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
  db-init:
    image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    entrypoint: [sh, /init/init-databases.sh]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - ./mysql:/init:ro
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"
  identity:
    <<: *app
    command: [/app/bin/identity]
    environment:
      <<: *app-env
      TESTMOON_IDENTITY_HTTP: 0.0.0.0:8091
      TESTMOON_IDENTITY_GRPC: 0.0.0.0:9091
      TESTMOON_IDENTITY_DSN: testmoon:${MYSQL_PASSWORD:?required}@tcp(mysql:3306)/testmoon_identity?charset=utf8mb4&parseTime=True&loc=UTC
      TESTMOON_BOOTSTRAP_USERNAME: ${TESTMOON_BOOTSTRAP_USERNAME:?required}
      TESTMOON_BOOTSTRAP_PASSWORD: ${TESTMOON_BOOTSTRAP_PASSWORD:?required}
    depends_on:
      db-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, curl, -fsS, --max-time, "2", http://127.0.0.1:8091/healthz]
  core:
    <<: *app
    command: [/app/bin/core]
    environment:
      <<: *app-env
      TESTMOON_CORE_HTTP: 0.0.0.0:8092
      TESTMOON_CORE_GRPC: 0.0.0.0:9092
      TESTMOON_CORE_DSN: testmoon:${MYSQL_PASSWORD:?required}@tcp(mysql:3306)/testmoon_core?charset=utf8mb4&parseTime=True&loc=UTC
    depends_on:
      db-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, curl, -fsS, --max-time, "2", http://127.0.0.1:8092/healthz]
  execution:
    <<: *app
    command: [/app/bin/execution]
    environment:
      <<: *app-env
      TESTMOON_EXECUTION_HTTP: 0.0.0.0:8093
      TESTMOON_EXECUTION_GRPC: 0.0.0.0:9093
      TESTMOON_EXECUTION_DSN: testmoon:${MYSQL_PASSWORD:?required}@tcp(mysql:3306)/testmoon_execution?charset=utf8mb4&parseTime=True&loc=UTC
    depends_on:
      db-init: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, curl, -fsS, --max-time, "2", http://127.0.0.1:8093/healthz]
  mock:
    <<: *app
    command: [/app/bin/mock]
    environment:
      <<: *app-env
      TESTMOON_MOCK_HTTP: 0.0.0.0:8094
      TESTMOON_MOCK_GRPC: 0.0.0.0:9094
      TESTMOON_MOCK_PUBLIC_HTTP: 0.0.0.0:8095
      TESTMOON_MOCK_DSN: testmoon:${MYSQL_PASSWORD:?required}@tcp(mysql:3306)/testmoon_mock?charset=utf8mb4&parseTime=True&loc=UTC
    depends_on:
      db-init: {condition: service_completed_successfully}
    healthcheck:
      <<: *health
      test: [CMD, curl, -fsS, --max-time, "2", http://127.0.0.1:8094/healthz]
  gateway:
    <<: *app
    command: [/app/bin/gateway]
    environment:
      <<: *app-env
      TESTMOON_GATEWAY_HTTP: 0.0.0.0:18080
      TESTMOON_IDENTITY_HTTP: identity:8091
      TESTMOON_CORE_HTTP: core:8092
      TESTMOON_EXECUTION_HTTP: execution:8093
      TESTMOON_MOCK_HTTP: mock:8094
      TESTMOON_MOCK_PUBLIC_HTTP: mock:8095
    ports: ["0.0.0.0:${GATEWAY_PORT:-18080}:18080"]
    depends_on:
      identity: {condition: service_healthy}
      core: {condition: service_healthy}
      execution: {condition: service_healthy}
      mock: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, curl, -fsS, --max-time, "2", http://127.0.0.1:18080/healthz]
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:19092"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
volumes:
  mysql-data:
  redis-data:
  kafka-data:
